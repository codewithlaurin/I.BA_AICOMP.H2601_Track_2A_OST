<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claimcheck live</title>
<style>
  :root { --bg:#101418; --panel:#181e24; --panel2:#1f262e; --line:#2a323b; --text:#e8edf2; --muted:#8b98a5;
          --ok:#3fb97f; --ok-bg:#12281f; --nok:#ef6461; --nok-bg:#2d1717; --neutral:#8b98a5; --accent:#4cc38a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1500px; margin:0 auto; padding:18px 20px 40px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:12px; }
  h1 { font-size:18px; font-weight:600; margin:0; }
  h1 span { color:var(--muted); font-weight:400; }
  #status { font-size:13px; color:var(--muted); }
  #status::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:7px; }
  #status.live { color:var(--accent); } #status.live::before { background:var(--accent); animation:pulse 1.2s infinite; }
  #status.error { color:var(--nok); } #status.error::before { background:var(--nok); }
  @keyframes pulse { 50% { opacity:.25; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes arrive { from { opacity:0; transform:translateY(-6px); } }

  .layout { display:grid; grid-template-columns:minmax(0, 1.65fr) minmax(340px, 1fr); gap:20px; align-items:start; }
  @media (max-width: 1000px) { .layout { grid-template-columns:1fr; } }

  .stage { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#000; }
  /* The subtitle strip sits directly under the picture and always keeps the height of two lines. */
  #subtitle { background:var(--panel); border-top:1px solid var(--line); padding:12px 18px;
              font-size:22px; line-height:1.35; height:calc(2 * 1.35em + 24px); text-align:center;
              display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
  #subtitle .interim { color:#b8c4cf; }
  #subtitle div { white-space:nowrap; }

  h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px; }
  details.transcript { margin-top:18px; }
  details.transcript summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--muted);
                               text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  #transcript { border:1px solid var(--line); border-radius:10px; max-height:240px; overflow-y:auto; background:var(--panel); }
  #transcript p { margin:0; padding:8px 14px; border-bottom:1px solid var(--line); cursor:pointer; color:#c5cfd9; font-size:14px; }
  #transcript p:last-child { border-bottom:0; }
  #transcript p:hover { background:var(--panel2); }
  #transcript p.now { color:var(--text); background:#202a33; box-shadow:inset 3px 0 0 var(--accent); }
  time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
  #transcript time { margin-right:10px; }
  .hint { padding:14px; color:var(--muted); font-size:14px; }

  /* ---- claims ---- */
  .claims-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  #tally { font-size:13px; color:var(--muted); white-space:nowrap; }
  #tally b { font-weight:600; } #tally .ok { color:var(--ok); } #tally .nok { color:var(--nok); }
  #claims { display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 110px); overflow-y:auto; padding-right:2px; }
  .claim { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; background:var(--panel);
           padding:12px 14px; animation:arrive .25s ease-out; }
  .claim .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .claim time { cursor:pointer; } .claim time:hover { color:var(--text); text-decoration:underline; }
  .claim .text { margin:0; font-size:16px; }
  .claim .text small { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:6px; }
  .badge { font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap;
           border:1px solid var(--line); color:var(--muted); }
  .claim.entailment { border-left-color:var(--ok); }
  .claim.entailment .badge { color:var(--ok); background:var(--ok-bg); border-color:transparent; }
  .claim.contradiction { border-left-color:var(--nok); }
  .claim.contradiction .badge { color:var(--nok); background:var(--nok-bg); border-color:transparent; }
  .claim.neutral { background:transparent; padding:9px 14px; }
  .claim.neutral .text { font-size:14px; color:#aeb9c4; }
  .claim.checking .badge::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px;
           border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  .claim details { margin-top:8px; font-size:14px; }
  .claim summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .claim summary:hover { color:var(--text); }
  .claim blockquote { margin:8px 0 0; padding:8px 12px; border-left:3px solid var(--line); background:var(--panel2);
                      border-radius:0 6px 6px 0; max-height:170px; overflow-y:auto; white-space:pre-wrap; }
  .claim blockquote b { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:2px; }
  .claim .said { color:var(--muted); margin:8px 0 0; font-size:13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>claimcheck live <span>· {{VIDEO_NAME}}</span></h1>
    <div id="status">Bereit – Video starten</div>
  </header>
  <div class="layout">
    <section>
      <div class="stage">
        <video id="video" src="/video" controls preload="metadata"></video>
        <div id="subtitle"></div>
      </div>
      <details class="transcript">
        <summary>Transkript</summary>
        <div id="transcript"><div id="empty" class="hint">Noch nichts transkribiert.</div></div>
      </details>
    </section>
    <aside>
      <div class="claims-head"><h2>Claims · Abgleich mit dem Büchlein</h2><div id="tally"></div></div>
      <div id="claims"><div class="hint" id="claims-hint">Claims erscheinen hier, sobald im Video eine prüfbare Aussage fällt.</div></div>
    </aside>
  </div>
</main>
<script>
const video = document.getElementById('video');
const subtitleBox = document.getElementById('subtitle');
const statusBox = document.getElementById('status');
const transcript = document.getElementById('transcript');
const claimsBox = document.getElementById('claims');
const claimsHint = document.getElementById('claims-hint');
const tally = document.getElementById('tally');

const LINE_CHARS = 58;   // characters per subtitle line
const HOLD = 2.5;        // seconds a finished sentence stays visible after its last word
const LABELS = { entailment: '✓ Belegt', contradiction: '✕ Widerspruch', neutral: 'Nicht im Büchlein' };

let segments = [];       // final transcript segments, sorted by start
let since = 0;           // number of final segments already received
let interim = null;      // text of the sentence being spoken right now (may still change)
let claims = new Map();  // id -> claim (latest version)
let rev = 0;             // newest claim revision already received
let openClaims = new Set();   // ids whose reference is unfolded

function clock(seconds) {
  const s = Math.floor(seconds);
  const pad = n => String(n).padStart(2, '0');
  return (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------------------------------------------------------------- transcript

function addSegment(segment) {
  let index = segments.findIndex(other => other.start > segment.start);
  if (index < 0) index = segments.length;
  segments.splice(index, 0, segment);
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const row = element('p');
  row.append(element('time', '', clock(segment.start)), segment.text);
  row.onclick = () => { video.currentTime = segment.start; video.play(); };
  segment.row = row;
  transcript.insertBefore(row, segments[index + 1] ? segments[index + 1].row : null);
}

// ---------------------------------------------------------------- claims

function claimCard(claim) {
  const state = claim.status === 'done' ? claim.label : claim.status;   // entailment | neutral | contradiction | checking | error
  const card = element('div', 'claim ' + state);
  const top = element('div', 'top');
  const stamp = element('time', '', clock(claim.start));
  stamp.title = 'Zur Stelle im Video springen';
  stamp.onclick = () => { video.currentTime = Math.max(claim.start - 1, 0); video.play(); };
  const badge = element('span', 'badge',
    claim.status === 'checking' ? 'wird geprüft' : claim.status === 'error' ? 'nicht geprüft' : LABELS[claim.label]);
  if (claim.status === 'error' && claim.note) badge.title = claim.note;
  top.append(stamp, badge);
  const text = element('p', 'text');
  text.append(element('small', '', 'Claim'), claim.text);
  card.append(top, text);

  const evidence = claim.evidence || [];
  if (evidence.length || claim.quote) {
    const details = element('details');
    details.open = openClaims.has(claim.id);
    details.ontoggle = () => details.open ? openClaims.add(claim.id) : openClaims.delete(claim.id);
    const pages = [...new Set(evidence.map(item => item.page).filter(Boolean))];
    const kinds = [...new Set(evidence.map(item => item.section).filter(Boolean))];
    details.append(element('summary', '', evidence.length
      ? 'Referenz · Büchlein S. ' + pages.join(', ') + (kinds.length ? ' · ' + kinds.join(', ') : '') : 'Gesagt wurde'));
    for (const item of evidence) {
      const quote = element('blockquote');
      quote.append(element('b', '', 'Seite ' + item.page + (item.section ? ' · ' + item.section : '')), item.text);
      details.append(quote);
    }
    if (claim.quote) details.append(element('p', 'said', 'Im Video: «' + claim.quote + '»'));
    card.append(details);
  }
  return card;
}

// Only claims the video has already reached are shown, newest on top - also when playing from the cache.
let claimsShown = '';
function renderClaims() {
  const t = video.currentTime;
  const visible = [...claims.values()].filter(claim => claim.t <= t + 0.3).sort((a, b) => b.t - a.t || b.rev - a.rev);
  const key = visible.map(claim => claim.id + ':' + claim.rev).join('|');
  if (key === claimsShown) return;
  claimsShown = key;
  claimsBox.replaceChildren(...(visible.length ? visible.map(claimCard) : [claimsHint]));
  const count = label => visible.filter(claim => claim.status === 'done' && claim.label === label).length;
  tally.innerHTML = visible.length
    ? `<b class="ok">${count('entailment')} belegt</b> · <b class="nok">${count('contradiction')} Widerspruch</b> · ${count('neutral')} nicht im Büchlein`
    : '';
}

// ---------------------------------------------------------------- sync with the server

function setStatus(data) {
  const problem = data.error || data.claims_error;
  if (problem) { statusBox.className = 'error'; statusBox.textContent = problem; }
  else if (data.live) { statusBox.className = 'live'; statusBox.textContent = 'Live-Transkription'; }
  else { statusBox.className = ''; statusBox.textContent = video.paused && data.can_transcribe ? 'Bereit – Video starten' : 'Untertitel aus dem Cache'; }
}

async function sync() {
  try {
    const playing = video.paused || video.ended ? 0 : 1;
    const response = await fetch(`/api/sync?t=${video.currentTime.toFixed(2)}&playing=${playing}&since=${since}&rev=${rev}`);
    const data = await response.json();
    since += data.segments.length;
    data.segments.forEach(addSegment);
    interim = data.interim;
    if (data.claims_enabled) {
      for (const claim of data.claims) claims.set(claim.id, claim);
      rev = data.rev;
    } else {
      claimsHint.textContent = 'Claim-Prüfung ist aus (ohne --booklet gestartet).';
    }
    setStatus(data);
  } catch (error) {
    statusBox.className = 'error';
    statusBox.textContent = 'Server nicht erreichbar';
  } finally {
    setTimeout(sync, 250);
  }
}

// ---------------------------------------------------------------- subtitles

// Lines are filled from the start of the sentence, so words already shown never move;
// only the last two lines are visible (roll-up captions, as on live TV).
function wrap(text) {
  const lines = [];
  let line = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    if (line && (line + ' ' + word).length > LINE_CHARS) { lines.push(line); line = word; }
    else line = line ? line + ' ' + word : word;
  }
  if (line) lines.push(line);
  return lines.slice(-2);
}

let shown = '', current = null;
function render() {
  const t = video.currentTime;
  let segment = null;
  for (let i = segments.length - 1; i >= 0; i--) if (segments[i].start <= t) { segment = segments[i]; break; }

  let text = '', isInterim = false;
  if (interim && interim.start <= t + 0.5 && (!segment || interim.start >= segment.end - 0.5)) {
    // The sentence being spoken now. Azure sends it without word times, and the audio sent to Azure
    // can run ahead of the picture (transcription starts a few seconds before the cached part ends),
    // so its words are spread over the stretch they cover and only those already reached are shown.
    const words = interim.text.split(/\s+/).filter(Boolean);
    const step = (interim.end - interim.start) / Math.max(words.length, 1);
    text = words.filter((word, i) => interim.start + i * step <= t).join(' ');
    isInterim = text !== '';
  }
  if (!isInterim && segment && t <= segment.end + HOLD) {
    text = segment.words.filter(word => word.t <= t).map(word => word.w).join(' ');
  }
  const key = (isInterim ? 'i' : 'f') + text;
  if (key !== shown) {
    shown = key;
    subtitleBox.replaceChildren(...wrap(text).map(line => element('div', isInterim ? 'interim' : '', line)));
  }
  if (segment !== current) {
    if (current && current.row) current.row.classList.remove('now');
    current = segment;
    if (segment) { segment.row.classList.add('now'); segment.row.scrollIntoView({ block: 'nearest' }); }
  }
  renderClaims();
  requestAnimationFrame(render);
}

sync();
requestAnimationFrame(render);
</script>
</body>
</html>
