<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · claimcheck live</title>
<style>
  :root { --bg:#101418; --panel:#181e24; --panel2:#1f262e; --line:#2a323b; --text:#e8edf2; --muted:#8b98a5;
          --ok:#3fb97f; --ok-bg:#12281f; --nok:#ef6461; --nok-bg:#2d1717; --neutral:#8b98a5; --accent:#4cc38a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1500px; margin:0 auto; padding:18px 20px 40px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:12px; }
  h1 { font-size:18px; font-weight:600; margin:0; }
  h1 span { color:var(--muted); font-weight:400; }
  header .left { display:flex; align-items:baseline; gap:16px; min-width:0; }
  header .right { display:flex; align-items:center; gap:20px; }
  a.back { color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; }
  a.back:hover { color:var(--text); }
  /* toggle switch */
  .switch { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none; }
  .switch input { display:none; }
  .switch .track { width:34px; height:20px; border-radius:999px; background:var(--line); position:relative; transition:background .15s; }
  .switch .track::after { content:""; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%;
                          background:#c5cfd9; transition:transform .15s; }
  .switch input:checked + .track { background:#2f6fb0; }
  .switch input:checked + .track::after { transform:translateX(14px); background:#fff; }
  .switch input:checked ~ .label { color:var(--text); }
  .switch.disabled { opacity:.45; cursor:not-allowed; }
  #status { font-size:13px; color:var(--muted); }
  #status::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:7px; }
  #status.live { color:var(--accent); } #status.live::before { background:var(--accent); animation:pulse 1.2s infinite; }
  #status.error { color:var(--nok); } #status.error::before { background:var(--nok); }
  @keyframes pulse { 50% { opacity:.25; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes arrive { from { opacity:0; transform:translateY(-6px); } }

  .layout { display:grid; grid-template-columns:minmax(0, 1.65fr) minmax(340px, 1fr); gap:20px; align-items:start; }
  @media (max-width: 1000px) { .layout { grid-template-columns:1fr; } }

  .stage { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; }
  video { display:block; width:100%; aspect-ratio:16/9; background:#000; }
  /* The subtitle strip sits directly under the picture and always keeps the height of two lines. */
  #subtitle { background:var(--panel); border-top:1px solid var(--line); padding:12px 18px;
              font-size:22px; line-height:1.35; height:calc(2 * 1.35em + 24px); text-align:center;
              display:flex; flex-direction:column; justify-content:center; overflow:hidden; }
  #subtitle .interim { color:#b8c4cf; }
  #subtitle div { white-space:nowrap; }

  h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px; }
  details.transcript { margin-top:18px; }
  details.transcript summary { cursor:pointer; font-size:13px; font-weight:600; color:var(--muted);
                               text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  #transcript { border:1px solid var(--line); border-radius:10px; max-height:240px; overflow-y:auto; background:var(--panel); }
  #transcript p { margin:0; padding:8px 14px; border-bottom:1px solid var(--line); cursor:pointer; color:#c5cfd9; font-size:14px; }
  #transcript p:last-child { border-bottom:0; }
  #transcript p:hover { background:var(--panel2); }
  #transcript p.now { color:var(--text); background:#202a33; box-shadow:inset 3px 0 0 var(--accent); }
  time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
  #transcript time { margin-right:10px; }
  .hint { padding:14px; color:var(--muted); font-size:14px; }

  /* ---- claims ---- */
  .claims-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  #tally { font-size:13px; color:var(--muted); white-space:nowrap; }
  #tally b { font-weight:600; } #tally .ok { color:var(--ok); } #tally .nok { color:var(--nok); }
  #claims { display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 110px); overflow-y:auto; padding-right:2px; }
  .claim { border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; background:var(--panel);
           padding:12px 14px; animation:arrive .25s ease-out; }
  .claim .top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .claim time { cursor:pointer; } .claim time:hover { color:var(--text); text-decoration:underline; }
  .claim .text { margin:0; font-size:16px; }
  .claim .text small { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:6px; }
  .badge { font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap;
           border:1px solid var(--line); color:var(--muted); }
  .claim.entailment { border-left-color:var(--ok); }
  .claim.entailment .badge { color:var(--ok); background:var(--ok-bg); border-color:transparent; }
  .claim.contradiction { border-left-color:var(--nok); }
  .claim.contradiction .badge { color:var(--nok); background:var(--nok-bg); border-color:transparent; }
  .claim.neutral { background:transparent; padding:9px 14px; }
  .claim.neutral .text { font-size:14px; color:#aeb9c4; }
  .claim.checking .badge::before { content:""; display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px;
           border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  .claim details { margin-top:8px; font-size:14px; }
  .claim summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .claim summary:hover { color:var(--text); }
  .claim blockquote { margin:8px 0 0; padding:8px 12px; border-left:3px solid var(--line); background:var(--panel2);
                      border-radius:0 6px 6px 0; max-height:170px; overflow-y:auto; white-space:pre-wrap; }
  .claim blockquote b { display:block; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:2px; }
  .claim .said { color:var(--muted); margin:8px 0 0; font-size:13px; }
  .claim .web-tag { font-size:11px; font-weight:700; letter-spacing:.04em; color:#8fc1f5; background:#13243a;
                    padding:2px 7px; border-radius:999px; margin-right:6px; }
  .claim .pending { font-size:12px; color:var(--muted); margin-left:8px; }
  .claim .pending::before { content:""; display:inline-block; width:9px; height:9px; margin-right:5px; vertical-align:-1px;
           border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  .claim blockquote a { color:#8fc1f5; font-size:12px; word-break:break-all; }
  .claim .text { cursor:pointer; }
  .claim .text:hover { text-decoration:underline; text-decoration-color:var(--muted); text-underline-offset:3px; }
  .claim .trace-link { background:none; border:0; padding:0; margin-left:8px; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; }
  .claim .trace-link:hover { color:var(--text); }

  /* ---- trace view: everything behind one card ---- */
  #trace[hidden], #trace-backdrop[hidden] { display:none; }
  #trace-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; }
  #trace { position:fixed; top:0; right:0; bottom:0; width:min(820px, 100vw); z-index:21; background:var(--bg);
           border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #trace header { margin:0; padding:14px 18px; border-bottom:1px solid var(--line); align-items:flex-start; }
  #trace header .claim-text { font-size:17px; margin:4px 0 0; }
  #trace header .meta { font-size:12px; color:var(--muted); }
  #trace .close { background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:5px 12px; cursor:pointer; font:inherit; font-size:13px; }
  #trace-body { overflow-y:auto; padding:16px 18px 40px; display:flex; flex-direction:column; gap:22px; }
  .tr-section { display:flex; flex-direction:column; gap:10px; }
  .tr-section > h3 { margin:0; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;
                     display:flex; gap:8px; align-items:center; }
  .tag { font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:none; padding:2px 8px; border-radius:999px;
         background:var(--panel2); color:var(--muted); border:1px solid var(--line); }
  .tag.warn { color:#e0b25c; border-color:#4a3a1c; background:#2a2214; }
  .tag.ok { color:var(--ok); background:var(--ok-bg); border-color:transparent; }
  .tag.nok { color:var(--nok); background:var(--nok-bg); border-color:transparent; }
  .tr-note { font-size:13px; color:var(--muted); margin:0; }
  .tr-transcript { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.6; }
  .tr-transcript .ctx { color:var(--muted); }
  .tr-transcript .seg { color:var(--text); background:#1f2a35; box-shadow:0 0 0 3px #1f2a35; border-radius:2px; }
  .tr-transcript mark { background:#3a3215; color:#f3dc8a; border-radius:2px; }
  .tr-transcript .lbl { display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:8px; }
  .tr-transcript .lbl:first-child { margin-top:0; }
  .tr-call { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  .tr-call > .head { display:flex; justify-content:space-between; gap:12px; align-items:baseline; padding:9px 14px; background:var(--panel2); }
  .tr-call > .head b { font-size:14px; }
  .tr-call > .head span { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .tr-call .part { padding:8px 14px; border-top:1px solid var(--line); }
  .tr-call .part > .lbl, .tr-call summary { font-size:12px; font-weight:600; color:var(--muted); }
  .tr-call summary { cursor:pointer; }
  .tr-call summary:hover { color:var(--text); }
  pre.code { margin:6px 0 0; padding:10px 12px; background:#0b0f13; border:1px solid var(--line); border-radius:6px; max-height:320px; overflow:auto;
             font:12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space:pre-wrap; word-break:break-word; color:#d5dde5; }
  .tr-call .error { color:var(--nok); font-size:13px; }
  .pages { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .pages details { border:1px solid var(--line); border-radius:6px; padding:4px 10px; background:#0b0f13; }
  .pages summary { font-weight:500; }
  table.tr { width:100%; border-collapse:collapse; font-size:13px; }
  table.tr th, table.tr td { text-align:left; padding:6px 8px; border-top:1px solid var(--line); vertical-align:top; }
  table.tr th { color:var(--muted); font-weight:600; font-size:12px; border-top:0; }
  table.tr td.why { color:var(--muted); white-space:nowrap; }
  .rules { display:grid; grid-template-columns:max-content minmax(0, 1fr); gap:6px 14px; font-size:13px; background:var(--panel);
           border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .rules dt { color:var(--muted); } .rules dd { margin:0; }
</style>
</head>
<body>
<main>
  <header>
    <div class="left">
      <a class="back" href="/">← Alle Arenen</a>
      <h1>{{TITLE}} <span>· {{VIDEO_NAME}}</span></h1>
    </div>
    <div class="right">
      <label class="switch" id="web-switch" title="Claims, zu denen das Büchlein nichts sagt, zusätzlich mit vertrauenswürdigen Web-Quellen prüfen">
        <input type="checkbox" id="web-toggle"><span class="track"></span><span class="label">Web-Recherche</span>
      </label>
      <div id="status">Bereit – Video starten</div>
    </div>
  </header>
  <div class="layout">
    <section>
      <div class="stage">
        <video id="video" src="video" controls preload="metadata"></video>
        <div id="subtitle"></div>
      </div>
      <details class="transcript">
        <summary>Transkript</summary>
        <div id="transcript"><div id="empty" class="hint">Noch nichts transkribiert.</div></div>
      </details>
    </section>
    <aside>
      <div class="claims-head"><h2 id="claims-title">Claims · Abgleich mit dem Büchlein</h2><div id="tally"></div></div>
      <div id="claims"><div class="hint" id="claims-hint">Claims erscheinen hier, sobald im Video eine prüfbare Aussage fällt.</div></div>
    </aside>
  </div>
</main>
<div id="trace-backdrop" hidden></div>
<section id="trace" hidden aria-label="Ablauf des Claims" role="dialog">
  <header>
    <div>
      <div class="meta" id="trace-meta"></div>
      <p class="claim-text" id="trace-claim"></p>
    </div>
    <button class="close" id="trace-close" type="button">Schliessen</button>
  </header>
  <div id="trace-body"></div>
</section>
<script>
const video = document.getElementById('video');
const subtitleBox = document.getElementById('subtitle');
const statusBox = document.getElementById('status');
const transcript = document.getElementById('transcript');
const claimsBox = document.getElementById('claims');
const claimsHint = document.getElementById('claims-hint');
const tally = document.getElementById('tally');
const webToggle = document.getElementById('web-toggle');
const webSwitch = document.getElementById('web-switch');
const claimsTitle = document.getElementById('claims-title');

const LINE_CHARS = 58;   // characters per subtitle line
const HOLD = 2.5;        // seconds a finished sentence stays visible after its last word
const LABELS = { entailment: '✓ Belegt', contradiction: '✕ Widerspruch', neutral: 'Nicht im Büchlein' };

let segments = [];       // final transcript segments, sorted by start
let since = 0;           // number of final segments already received
let interim = null;      // text of the sentence being spoken right now (may still change)
let claims = new Map();  // id -> claim (latest version)
let rev = 0;             // newest claim revision already received
let openClaims = new Set();   // ids whose reference is unfolded
let webPages = 0;        // web pages collected for this arena (0: the toggle is off and disabled)

// The toggle is remembered per browser; storage can be unavailable, then it simply starts off.
try { webToggle.checked = localStorage.getItem('claimcheck-web') === '1'; } catch (error) {}
webToggle.onchange = () => {
  try { localStorage.setItem('claimcheck-web', webToggle.checked ? '1' : '0'); } catch (error) {}
  claimsShown = '';
};
const webOn = () => webToggle.checked && webPages > 0;

function clock(seconds) {
  const s = Math.floor(seconds);
  const pad = n => String(n).padStart(2, '0');
  return (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------------------------------------------------------------- transcript

function addSegment(segment) {
  let index = segments.findIndex(other => other.start > segment.start);
  if (index < 0) index = segments.length;
  segments.splice(index, 0, segment);
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
  const row = element('p');
  row.append(element('time', '', clock(segment.start)), segment.text);
  row.onclick = () => { video.currentTime = segment.start; video.play(); };
  segment.row = row;
  transcript.insertBefore(row, segments[index + 1] ? segments[index + 1].row : null);
}

// ---------------------------------------------------------------- claims

// The verdict the page shows: the booklet's, or with the toggle on and the booklet silent, the web's.
function verdict(claim) {
  if (claim.status !== 'done') return { state: claim.status, label: null, evidence: [], web: false };
  if (webOn() && claim.label === 'neutral' && claim.web)
    return { state: claim.web.label, label: claim.web.label, evidence: claim.web.evidence || [], web: true };
  return { state: claim.label, label: claim.label, evidence: claim.evidence || [], web: false };
}

function claimCard(claim) {
  const v = verdict(claim);   // state: entailment | neutral | contradiction | checking | error
  const card = element('div', 'claim ' + v.state);
  const top = element('div', 'top');
  const stamp = element('time', '', clock(claim.start));
  stamp.title = 'Zur Stelle im Video springen';
  stamp.onclick = () => { video.currentTime = Math.max(claim.start - 1, 0); video.play(); };
  const right = element('span');
  if (v.web && v.label !== 'neutral') right.append(element('span', 'web-tag', 'WEB'));
  let text = claim.status === 'checking' ? 'wird geprüft' : claim.status === 'error' ? 'nicht geprüft' : LABELS[v.label];
  if (v.label === 'neutral' && webOn() && claim.web) text = 'Nicht belegt';
  const badge = element('span', 'badge', text);
  if (claim.status === 'error' && claim.note) badge.title = claim.note;
  right.append(badge);
  const left = element('span');
  const traceLink = element('button', 'trace-link', 'Ablauf ›');
  traceLink.type = 'button';
  traceLink.title = 'Was Apertus bekommen und geantwortet hat';
  traceLink.onclick = () => openTrace(claim.id);
  left.append(stamp, traceLink);
  top.append(left, right);
  const body = element('p', 'text');
  body.title = 'Ablauf anzeigen';
  body.onclick = () => openTrace(claim.id);
  body.append(element('small', '', 'Claim'), claim.text);
  if (webOn() && claim.status === 'done' && claim.label === 'neutral' && !claim.web && claim.web_status !== 'error')
    body.append(element('span', 'pending', 'Web-Recherche läuft'));
  card.append(top, body);

  const evidence = v.evidence;
  if (evidence.length || claim.quote) {
    const details = element('details');
    details.open = openClaims.has(claim.id);
    details.ontoggle = () => details.open ? openClaims.add(claim.id) : openClaims.delete(claim.id);
    let summary = 'Gesagt wurde';
    if (evidence.length && v.web) {
      summary = 'Referenz · Web · ' + [...new Set(evidence.map(item => item.source))].join(', ');
    } else if (evidence.length) {
      const pages = [...new Set(evidence.map(item => item.page).filter(Boolean))];
      const kinds = [...new Set(evidence.map(item => item.section).filter(Boolean))];
      summary = 'Referenz · Büchlein S. ' + pages.join(', ') + (kinds.length ? ' · ' + kinds.join(', ') : '');
    }
    details.append(element('summary', '', summary));
    for (const item of evidence) {
      const quote = element('blockquote');
      if (v.web) {
        quote.append(element('b', '', item.source + (item.media ? ' · Medienbericht' : '') + (item.title ? ' · ' + item.title : '')),
                     item.text, document.createElement('br'));
        const link = element('a', '', item.url);
        link.href = item.url; link.target = '_blank'; link.rel = 'noopener';
        quote.append(link);
      } else {
        quote.append(element('b', '', 'Seite ' + item.page + (item.section ? ' · ' + item.section : '')), item.text);
      }
      details.append(quote);
    }
    if (claim.quote) details.append(element('p', 'said', 'Im Video: «' + claim.quote + '»'));
    card.append(details);
  }
  return card;
}

// Only claims the video has already reached are shown, newest on top - also when playing from the cache.
let claimsShown = '';
function renderClaims() {
  const t = video.currentTime;
  const visible = [...claims.values()].filter(claim => claim.t <= t + 0.3).sort((a, b) => b.t - a.t || b.rev - a.rev);
  const key = (webOn() ? 'w' : 'b') + visible.map(claim => claim.id + ':' + claim.rev).join('|');
  if (key === claimsShown) return;
  claimsShown = key;
  claimsBox.replaceChildren(...(visible.length ? visible.map(claimCard) : [claimsHint]));
  const count = label => visible.filter(claim => claim.status === 'done' && verdict(claim).label === label).length;
  tally.innerHTML = visible.length
    ? `<b class="ok">${count('entailment')} belegt</b> · <b class="nok">${count('contradiction')} Widerspruch</b> · ${count('neutral')} ${webOn() ? 'nicht belegt' : 'nicht im Büchlein'}`
    : '';
  claimsTitle.textContent = webOn() ? 'Claims · Büchlein und Web-Quellen' : 'Claims · Abgleich mit dem Büchlein';
}

// ---------------------------------------------------------------- sync with the server

function setStatus(data) {
  const problem = data.error || data.claims_error;
  if (problem) { statusBox.className = 'error'; statusBox.textContent = problem; }
  else if (data.live) { statusBox.className = 'live'; statusBox.textContent = 'Live-Transkription'; }
  else { statusBox.className = ''; statusBox.textContent = video.paused && data.can_transcribe ? 'Bereit – Video starten' : 'Untertitel aus dem Cache'; }
}

async function sync() {
  try {
    const playing = video.paused || video.ended ? 0 : 1;
    const response = await fetch(`api/sync?t=${video.currentTime.toFixed(2)}&playing=${playing}&since=${since}&rev=${rev}&web=${webOn() ? 1 : 0}`);
    const data = await response.json();
    if (data.web_pages !== webPages) {
      webPages = data.web_pages || 0;
      webSwitch.classList.toggle('disabled', webPages === 0);
      webToggle.disabled = webPages === 0;
      webSwitch.title = webPages ? `Claims, zu denen das Büchlein nichts sagt, zusätzlich mit ${webPages} vertrauenswürdigen Web-Seiten prüfen`
                                 : 'Für diese Arena sind keine Web-Quellen gesammelt (python -m claimcheck.live.batch)';
      claimsShown = '';
    }
    since += data.segments.length;
    data.segments.forEach(addSegment);
    interim = data.interim;
    if (data.claims_enabled) {
      for (const claim of data.claims) claims.set(claim.id, claim);
      rev = data.rev;
    } else {
      claimsHint.textContent = 'Claim-Prüfung ist aus (kein Büchlein für diese Arena).';
    }
    setStatus(data);
  } catch (error) {
    statusBox.className = 'error';
    statusBox.textContent = 'Server nicht erreichbar';
  } finally {
    setTimeout(sync, 250);
  }
}

// ---------------------------------------------------------------- subtitles

// Lines are filled from the start of the sentence, so words already shown never move;
// only the last two lines are visible (roll-up captions, as on live TV).
function wrap(text) {
  const lines = [];
  let line = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    if (line && (line + ' ' + word).length > LINE_CHARS) { lines.push(line); line = word; }
    else line = line ? line + ' ' + word : word;
  }
  if (line) lines.push(line);
  return lines.slice(-2);
}

let shown = '', current = null;
function render() {
  const t = video.currentTime;
  let segment = null;
  for (let i = segments.length - 1; i >= 0; i--) if (segments[i].start <= t) { segment = segments[i]; break; }

  let text = '', isInterim = false;
  if (interim && interim.start <= t + 0.5 && (!segment || interim.start >= segment.end - 0.5)) {
    // The sentence being spoken now. Azure sends it without word times, and the audio sent to Azure
    // can run ahead of the picture (transcription starts a few seconds before the cached part ends),
    // so its words are spread over the stretch they cover and only those already reached are shown.
    const words = interim.text.split(/\s+/).filter(Boolean);
    const step = (interim.end - interim.start) / Math.max(words.length, 1);
    text = words.filter((word, i) => interim.start + i * step <= t).join(' ');
    isInterim = text !== '';
  }
  if (!isInterim && segment && t <= segment.end + HOLD) {
    text = segment.words.filter(word => word.t <= t).map(word => word.w).join(' ');
  }
  const key = (isInterim ? 'i' : 'f') + text;
  if (key !== shown) {
    shown = key;
    subtitleBox.replaceChildren(...wrap(text).map(line => element('div', isInterim ? 'interim' : '', line)));
  }
  if (segment !== current) {
    if (current && current.row) current.row.classList.remove('now');
    current = segment;
    if (segment) { segment.row.classList.add('now'); segment.row.scrollIntoView({ block: 'nearest' }); }
  }
  renderClaims();
  requestAnimationFrame(render);
}

// ---------------------------------------------------------------- trace view

const traceBox = document.getElementById('trace');
const traceBackdrop = document.getElementById('trace-backdrop');
const traceBody = document.getElementById('trace-body');
const STEP_NOTE = {
  'Claim-Erkennung': 'Sucht im Transkript-Abschnitt prüfbare Aussagen.',
  'Erste Prüfung': 'Sucht in den gesendeten Seiten den Satz zur selben Sache: passt, widerspricht oder fehlt.',
  'Zweiter Blick': 'Sieht nur den Claim und den zitierten Satz: SUPPORT, CONFLICT oder UNRELATED.',
  'Satzsuche: gleiche Sache': 'Das Zitat der ersten Prüfung stand nicht wörtlich im Text. Der Satz wird neu gesucht.',
  'Satzsuche: stützender Satz': 'Vor einem Widerspruch: Gibt es doch einen Satz, der den Claim stützt?',
};
const HOW = {
  'not addressed': 'Thema nicht gefunden',
  'second look': 'Entscheid des zweiten Blicks',
  'checks disagree': 'Zweiter Blick sah Konflikt, aber kein zweites Signal: nicht rot',
  'supporting sentence found': 'Stützender Satz gefunden',
  'figure off by a factor of 1000 (speech recognition)': 'Zahl um Faktor 1000 verschoben (Spracherkennung)',
  'web sources do not contradict': 'Web-Quellen widersprechen nie',
};
const REJECTED = { type: 'kein prüfbarer Typ', 'about the booklet': 'spricht über das Büchlein' };

function closeTrace() { traceBox.hidden = true; traceBackdrop.hidden = true; }
document.getElementById('trace-close').onclick = closeTrace;
traceBackdrop.onclick = closeTrace;
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !traceBox.hidden) closeTrace(); });

function pretty(text) {
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch (error) { return text; }
}

function codeBlock(text) { return element('pre', 'code', text); }

function collapsible(title, content, open = false) {
  const box = element('details');
  box.open = open;
  box.append(element('summary', '', title), content);
  return box;
}

function labelTag(label) {
  const names = { entailment: 'Belegt', contradiction: 'Widerspruch', neutral: 'Nicht im Büchlein' };
  const kind = { entailment: 'ok', contradiction: 'nok' }[label] || '';
  return element('span', 'tag ' + kind, names[label] || label || '–');
}

// The request: booklet pages (or web passages) one by one, everything else as JSON.
function requestView(user) {
  let data;
  try { data = JSON.parse(user); } catch (error) { return codeBlock(user); }
  const wrap = element('div');
  const pages = Array.isArray(data.chunks) ? data.chunks : null;
  const rest = { ...data };
  if (pages) rest.chunks = '[' + pages.length + ' Abschnitte, siehe unten]';
  wrap.append(codeBlock(JSON.stringify(rest, null, 2)));
  if (pages) {
    const list = element('div', 'pages');
    for (const chunk of pages) {
      const where = chunk.page != null ? 'Seite ' + chunk.page : (chunk.source || chunk.url || 'Abschnitt');
      list.append(collapsible('Abschnitt ' + chunk.chunk + ' · ' + where + ' · ' + (chunk.text || '').length + ' Zeichen',
                              codeBlock(chunk.text || '')));
    }
    wrap.append(list);
  }
  return wrap;
}

function callView(step) {
  const box = element('div', 'tr-call');
  const head = element('div', 'head');
  const meta = [step.model, step.input_tokens != null ? step.input_tokens + ' → ' + step.output_tokens + ' Tokens' : null,
                step.ms != null ? (step.ms / 1000).toFixed(1) + ' s' : null].filter(Boolean).join(' · ');
  head.append(element('b', '', step.name), element('span', '', meta));
  box.append(head);
  if (STEP_NOTE[step.name]) {
    const note = element('div', 'part');
    note.append(element('p', 'tr-note', STEP_NOTE[step.name]));
    box.append(note);
  }
  const system = element('div', 'part');
  system.append(collapsible('Systemprompt (' + step.system.length + ' Zeichen)', codeBlock(step.system)));
  const request = element('div', 'part');
  request.append(collapsible('Gesendet', requestView(step.user), true));
  const answer = element('div', 'part');
  if (step.error) answer.append(element('div', 'lbl', 'Fehler'), element('p', 'error', step.error));
  else answer.append(element('div', 'lbl', 'Antwort von Apertus (roh)'), codeBlock(pretty(step.response)));
  box.append(system, request, answer);
  return box;
}

function statementsView(items) {
  if (!items.length) return element('p', 'tr-note', 'Apertus hat in diesem Abschnitt keine Aussage gefunden.');
  const table = element('table', 'tr');
  const head = element('tr');
  ['Aussage', 'Typ', 'Ergebnis'].forEach(text => head.append(element('th', '', text)));
  table.append(head);
  for (const item of items) {
    const row = element('tr');
    const text = element('td');
    text.append(item.text || '');
    if (item.quote) text.append(element('div', 'tr-note', '«' + item.quote + '»'));
    const result = item.rejected == null ? 'geprüft' : 'verworfen: ' + (REJECTED[item.rejected] || item.rejected);
    row.append(text, element('td', 'why', item.type || ''), element('td', 'why', result));
    table.append(row);
  }
  return table;
}

function rulesView(rules, why) {
  const list = element('dl', 'rules');
  const add = (term, value) => { if (value == null || value === '') return; list.append(element('dt', '', term), element('dd', '', value)); };
  const yes = value => value == null ? null : value ? 'ja' : 'nein';
  if (why) {
    add('Claim laut Apertus', why.claim_says);
    add('Quelle laut Apertus', why.passage_says);
  }
  add('Erste Prüfung', rules.first_check || (why && why.first));
  add('Zweiter Blick', rules.second_look || (why && why.relation));
  add('Zahlen weichen ab', yes(rules.figures_differ));
  add('Faktor 1000 (Spracherkennung)', yes(rules.scale_slip));
  if (rules.sections && rules.sections.some(Boolean)) add('Textsorte der Zitate', rules.sections.filter(Boolean).join(', '));
  add('Entscheid', HOW[rules.how] || rules.how || (why && (HOW[why.how] || why.how)));
  if (rules.label) {
    const result = element('dd');
    result.append(labelTag(rules.label));
    list.append(element('dt', '', 'Ergebnis'), result);
  }
  return list;
}

function checkView(check) {
  const wrap = element('div', 'tr-section');
  if (check.error) wrap.append(element('p', 'error', 'Fehler: ' + check.error));
  const steps = check.steps || [];
  for (const step of steps) {
    if (step.kind === 'call') wrap.append(callView(step));
    else if (step.kind === 'rules') wrap.append(rulesView(step, check.why));
  }
  if (!steps.some(step => step.kind === 'rules') && check.why) wrap.append(rulesView({ label: check.label }, check.why));
  return wrap;
}

function section(title, ...tags) {
  const box = element('div', 'tr-section');
  const head = element('h3', '', title);
  tags.filter(Boolean).forEach(tag => head.append(tag));
  box.append(head);
  return box;
}

function transcriptView(context, quote) {
  const box = element('div', 'tr-transcript');
  if (context.before) box.append(element('span', 'lbl', 'Vorher (Kontext)'), element('span', 'ctx', context.before));
  box.append(element('span', 'lbl', 'Abschnitt, aus dem der Claim stammt'));
  const segment = element('span', 'seg');
  const text = context.segment || '';
  const at = quote ? text.indexOf(quote) : -1;
  if (at >= 0) segment.append(text.slice(0, at), element('mark', '', quote), text.slice(at + quote.length));
  else segment.append(text || '(nicht gefunden)');
  box.append(segment);
  if (context.after) box.append(element('span', 'lbl', 'Nachher (Kontext)'), element('span', 'ctx', context.after));
  return box;
}

function notRecorded(text) { return element('p', 'tr-note', text); }

function renderTrace(data) {
  const claim = data.claim;
  document.getElementById('trace-claim').textContent = claim.text;
  document.getElementById('trace-meta').textContent =
    clock(claim.start || 0) + ' · ' + (data.arena.vote || '') + ' · ' + data.versions.claims + ', ' + data.versions.verify;
  const parts = [];

  const transcript = section('Transkript', data.transcript.reconstructed ? element('span', 'tag warn', 'rekonstruiert') : null);
  transcript.append(transcriptView(data.transcript, claim.quote));
  if (claim.quote) transcript.append(element('p', 'tr-note', 'Markiert: das Zitat, das Apertus zum Claim angegeben hat («' + claim.quote + '»).'));
  if (data.transcript.reconstructed)
    transcript.append(notRecorded('Aus dem Untertitel-Cache so zusammengesetzt, wie die Auswertung ihn aufbaut: zwei Abschnitte davor, einer danach. Im Live-Betrieb kann der Text danach kürzer gewesen sein.'));
  parts.push(transcript);

  const extraction = section('1 · Claim-Erkennung', data.extraction ? null : element('span', 'tag warn', 'nicht aufgezeichnet'));
  if (data.extraction) {
    for (const step of data.extraction.steps) {
      if (step.kind === 'call') extraction.append(callView(step));
      else if (step.kind === 'statements') extraction.append(element('p', 'tr-note', 'Alle Aussagen, die Apertus gefunden hat:'), statementsView(step.items));
    }
    if (data.extraction.error) extraction.append(element('p', 'error', 'Fehler: ' + data.extraction.error));
  } else {
    extraction.append(notRecorded('Dieser Claim wurde geprüft, bevor das Aufzeichnen eingebaut war. Die Antwort von Apertus ist nicht gespeichert. Der Prompt unten ist der aktuelle Stand.'),
                      collapsible('Prompt (aktueller Stand)', codeBlock(data.prompts['Claim-Erkennung'])));
  }
  parts.push(extraction);

  const booklet = section('2 · Prüfung gegen das Büchlein', claim.label ? labelTag(claim.label) : null,
                          data.booklet ? null : element('span', 'tag warn', 'nicht aufgezeichnet'));
  if (data.booklet) booklet.append(checkView(data.booklet));
  else {
    booklet.append(notRecorded('Nur das gespeicherte Ergebnis liegt vor. Gesendet wurden die Büchlein-Seiten ' +
                               (data.arena.pages || '(Auswahl per Suche)') + ' aus ' + (data.arena.booklet || 'dem Büchlein') + '.'));
    for (const name of ['Erste Prüfung', 'Zweiter Blick', 'Satzsuche'])
      booklet.append(collapsible('Prompt «' + name + '» (aktueller Stand)', codeBlock(data.prompts[name])));
  }
  if (claim.evidence && claim.evidence.length) {
    const cited = element('div');
    for (const item of claim.evidence) cited.append(codeBlock('Seite ' + item.page + (item.section ? ' · ' + item.section : '') + '\n' + item.text));
    booklet.append(collapsible('Zitat auf der Karte', cited, true));
  }
  parts.push(booklet);

  if (data.web || claim.web) {
    const web = section('3 · Web-Recherche', claim.web ? labelTag(claim.web.label) : null,
                        data.web ? null : element('span', 'tag warn', 'nicht aufgezeichnet'));
    if (data.web) web.append(checkView(data.web));
    else web.append(notRecorded('Nur das gespeicherte Ergebnis liegt vor.'));
    parts.push(web);
  }
  traceBody.replaceChildren(...parts);
  traceBody.scrollTop = 0;
}

async function openTrace(id) {
  traceBox.hidden = false; traceBackdrop.hidden = false;
  document.getElementById('trace-claim').textContent = claims.get(id) ? claims.get(id).text : '';
  document.getElementById('trace-meta').textContent = '';
  traceBody.replaceChildren(element('p', 'tr-note', 'Lade Ablauf …'));
  try {
    const response = await fetch('api/trace?claim=' + encodeURIComponent(id));
    if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
    renderTrace(await response.json());
  } catch (error) {
    traceBody.replaceChildren(element('p', 'error', 'Ablauf nicht verfügbar: ' + error.message));
  }
}

sync();
requestAnimationFrame(render);
</script>
