[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-claimcheck"
version = "0.1.0"
description = "Track 2A / OST multilingual claim checking CLI"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "pypdf>=6.20.0",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.10",
]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "argparse>=1.4.0",
]
